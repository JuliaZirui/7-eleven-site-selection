<text x="310.0" y="223.75" text-anchor="middle" font-size="21.2" font-weight="700" fill="#1f2933">Collect &amp; clean</text>
<text x="310.0" y="253.8" text-anchor="middle" font-size="17.5" fill="#4b5563">fetch, dedupe, merge POIs across providers;</text>
<text x="310.0" y="280.0" text-anchor="middle" font-size="17.5" fill="#4b5563">store as dated SQLite snapshots</text>
