<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1060" width="1240" height="1060" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9aa3ad"/></marker></defs><rect width="1240" height="1060" fill="#ffffff"/><text x="60" y="40" font-size="24.6" font-weight="700" fill="#0b2545">Transit-Node Site Screening — how it works</text>
