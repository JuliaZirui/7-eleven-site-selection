<text x="310.0" y="391.8" text-anchor="middle" font-size="17.5" fill="#4b5563">people per day (residents + workers + visitors);</text>
<text x="310.0" y="418.0" text-anchor="middle" font-size="17.5" fill="#4b5563">competitors open per day</text>
