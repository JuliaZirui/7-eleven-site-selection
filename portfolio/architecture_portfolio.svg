<text x="930.0" y="533.6" text-anchor="middle" font-size="17.5" fill="#3b2a5c">Policy: A rule / B impact-ordered (default) / C Claude</text>
<text x="930.0" y="559.9" text-anchor="middle" font-size="17.5" fill="#3b2a5c">Code guard: allowed tools, max 4 calls per run</text>
<text x="930.0" y="586.1" text-anchor="middle" font-size="17.5" fill="#3b2a5c">Action: refetch data, or flag a field check</text>
