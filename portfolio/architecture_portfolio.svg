<text x="930.0" y="260.5" text-anchor="middle" font-size="21.2" font-weight="700" fill="#3f1d7a">LLM data audit · Claude</text>
<text x="930.0" y="290.5" text-anchor="middle" font-size="17.5" fill="#3b2a5c">Rules list records that look wrong;</text>
<text x="930.0" y="316.8" text-anchor="middle" font-size="17.5" fill="#3b2a5c">Claude checks each one with web search</text>
<text x="930.0" y="343.0" text-anchor="middle" font-size="17.5" fill="#3b2a5c">Code guard → an analyst accepts or rejects</text>
<text x="930.0" y="369.2" text-anchor="middle" font-size="17.5" fill="#3b2a5c">Never changes a number itself</text>
