name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-llm.txt
      # Fixed test categories + offline end-to-end reproducibility check.
      # Exits non-zero on any failure or if scores differ from the recorded run.
      - run: python tests/run_day6.py
      # The documented quick start must keep working: offline demo + example input.
      - run: python src/cli.py validate
      - run: python src/cli.py demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-log-py${{ matrix.python-version }}
          path: |
            reports/day6_test_log_*
            logs/
